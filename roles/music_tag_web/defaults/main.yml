---
################################
# Basics
################################
music_tag_web_name: music_tag_web

################################
# Paths
################################
music_tag_web_role_paths_folder: "music-tag-web"
music_tag_web_role_paths_location: "{{ server_appdata_path }}/{{ music_tag_web_role_paths_folder }}"
music_tag_web_role_paths_folders_list:
  - "{{ music_tag_web_role_paths_location }}"
  - "/mnt/unionfs/Media/Music/library"

################################
# Web
################################
music_tag_web_role_web_subdomain: "music-tag"
music_tag_web_role_web_domain: "{{ user.domain }}"
music_tag_web_role_web_port: "8002"
music_tag_web_role_web_url: "{{ 'https://' + (lookup('role_var', '_web_subdomain', role='music_tag_web') + '.' + lookup('role_var', '_web_domain', role='music_tag_web') if (lookup('role_var', '_web_subdomain', role='music_tag_web') | length > 0) else lookup('role_var', '_web_domain', role='music_tag_web')) }}"

################################
# DNS
################################
music_tag_web_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='music_tag_web') }}"
music_tag_web_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='music_tag_web') }}"
music_tag_web_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik (Reverse Proxy & Auth)
################################
music_tag_web_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
music_tag_web_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
music_tag_web_role_traefik_middleware_custom: ""
music_tag_web_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
music_tag_web_role_traefik_enabled: true
music_tag_web_role_traefik_api_enabled: false
music_tag_web_role_traefik_api_endpoint: ""

################################
# Docker
################################
music_tag_web_role_docker_container: "music-tag-web"

# Image
music_tag_web_role_docker_image_pull: true
music_tag_web_role_docker_image_repo: "xhongc/music_tag_web"
music_tag_web_role_docker_image_tag: "latest"
music_tag_web_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='music_tag_web') }}:{{ lookup('role_var', '_docker_image_tag', role='music_tag_web') }}"

# Envs
music_tag_web_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  TZ: "{{ tz }}"

music_tag_web_role_docker_envs_custom: {}
music_tag_web_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='music_tag_web') | combine(lookup('role_var', '_docker_envs_custom', role='music_tag_web')) }}"

# Volumes
music_tag_web_role_docker_volumes_default:
  - "{{ music_tag_web_role_paths_location }}:/app/data"
  - "/mnt/unionfs/Media/Music/library:/app/media:rw"

music_tag_web_role_docker_volumes_custom: []
music_tag_web_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='music_tag_web') + lookup('role_var', '_docker_volumes_custom', role='music_tag_web') }}"

# Ports
music_tag_web_role_docker_ports_defaults: []
music_tag_web_role_docker_ports_custom: []
music_tag_web_role_docker_ports: "{{ lookup('role_var', '_docker_ports_defaults', role='music_tag_web') + lookup('role_var', '_docker_ports_custom', role='music_tag_web') }}"

# Network & Hostname
music_tag_web_role_docker_hostname: "{{ music_tag_web_name }}"
music_tag_web_role_docker_networks_alias: "{{ music_tag_web_name }}"
music_tag_web_role_docker_networks_default: []
music_tag_web_role_docker_networks_custom: []
music_tag_web_role_docker_networks: "{{ docker_networks_common + lookup('role_var', '_docker_networks_default', role='music_tag_web') + lookup('role_var', '_docker_networks_custom', role='music_tag_web') }}"

# Commands
music_tag_web_role_docker_commands_default: ["/start"]
music_tag_web_role_docker_commands_custom: []
music_tag_web_role_docker_commands: "{{ lookup('role_var', '_docker_commands_default', role='music_tag_web') + lookup('role_var', '_docker_commands_custom', role='music_tag_web') }}"


# Operations
music_tag_web_role_docker_restart_policy: unless-stopped
music_tag_web_role_docker_state: started
