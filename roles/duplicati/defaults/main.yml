#########################################################################
---
################################
# Basics
################################

duplicati_name: duplicati

################################
# Settings
################################

duplicati_role_backups_path: "{{ server_appdata_path }}/{{ duplicati_name }}/backups"

################################
# Paths
################################

duplicati_role_paths_folder: "{{ duplicati_name }}"
duplicati_role_paths_location: "{{ server_appdata_path }}/{{ duplicati_role_paths_folder }}"
duplicati_role_paths_folders_list_default:
  - "{{ lookup('role_var', '_paths_location', role='duplicati') }}"
duplicati_role_paths_folders_list_custom: []
duplicati_role_paths_folders_list: "{{ lookup('role_var', '_paths_folders_list_default', role='duplicati')
                                    + lookup('role_var', '_paths_folders_list_custom', role='duplicati') }}"

################################
# Web
################################

duplicati_role_web_subdomain: "{{ duplicati_name }}"
duplicati_role_web_domain: "{{ user.domain }}"
duplicati_role_web_port: "8200"
duplicati_role_web_url: "{{ 'https://' + (lookup('role_var', '_web_subdomain', role='duplicati') + '.' + lookup('role_var', '_web_domain', role='duplicati')
                         if (lookup('role_var', '_web_subdomain', role='duplicati') | length > 0)
                         else lookup('role_var', '_web_domain', role='duplicati')) }}"

################################
# DNS
################################

duplicati_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='duplicati') }}"
duplicati_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='duplicati') }}"
duplicati_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

duplicati_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
duplicati_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
duplicati_role_traefik_middleware_custom: ""
duplicati_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
duplicati_role_traefik_enabled: true
duplicati_role_traefik_api_enabled: true
duplicati_role_traefik_api_endpoint: "PathPrefix(`/api`)"

################################
# Docker
################################

# Container
duplicati_role_docker_container: "{{ duplicati_name }}"

# Image
duplicati_role_docker_image_pull: true
duplicati_role_docker_image_tag: "latest"
duplicati_role_docker_image_repo: "linuxserver/duplicati"
duplicati_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='duplicati') }}:{{ lookup('role_var', '_docker_image_tag', role='duplicati') }}"

# Ports
duplicati_role_docker_ports_defaults: []
duplicati_role_docker_ports_custom: []
duplicati_role_docker_ports: "{{ lookup('role_var', '_docker_ports_defaults', role='duplicati')
                              + lookup('role_var', '_docker_ports_custom', role='duplicati') }}"

# Envs
duplicati_role_docker_envs_default:
  TZ: "{{ tz }}"
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
duplicati_role_docker_envs_custom: {}
duplicati_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='duplicati')
                             | combine(lookup('role_var', '_docker_envs_custom', role='duplicati')) }}"

# Commands
duplicati_role_docker_commands_default: []
duplicati_role_docker_commands_custom: []
duplicati_role_docker_commands: "{{ lookup('role_var', '_docker_commands_default', role='duplicati')
                                 + lookup('role_var', '_docker_commands_custom', role='duplicati') }}"

# Volumes
duplicati_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='duplicati') }}:/config"
  - "/opt:/saltbox/opt"
  - "/srv/git/saltbox:/saltbox/saltbox"
duplicati_role_docker_volumes_custom: []
duplicati_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='duplicati')
                                + lookup('role_var', '_docker_volumes_custom', role='duplicati') }}"

# Devices
duplicati_role_docker_devices_default: []
duplicati_role_docker_devices_custom: []
duplicati_role_docker_devices: "{{ lookup('role_var', '_docker_devices_default', role='duplicati')
                                + lookup('role_var', '_docker_devices_custom', role='duplicati') }}"

# Hosts
duplicati_role_docker_hosts_default: {}
duplicati_role_docker_hosts_custom: {}
duplicati_role_docker_hosts: "{{ docker_hosts_common
                              | combine(lookup('role_var', '_docker_hosts_default', role='duplicati'))
                              | combine(lookup('role_var', '_docker_hosts_custom', role='duplicati')) }}"

# Labels
duplicati_role_docker_labels_default: {}
duplicati_role_docker_labels_custom: {}
duplicati_role_docker_labels: "{{ docker_labels_common
                               | combine(lookup('role_var', '_docker_labels_default', role='duplicati'))
                               | combine(lookup('role_var', '_docker_labels_custom', role='duplicati')) }}"

# Hostname
duplicati_role_docker_hostname: "{{ duplicati_name }}"

# Networks
duplicati_role_docker_networks_alias: "{{ duplicati_name }}"
duplicati_role_docker_networks_default: []
duplicati_role_docker_networks_custom: []
duplicati_role_docker_networks: "{{ docker_networks_common
                                 + lookup('role_var', '_docker_networks_default', role='duplicati')
                                 + lookup('role_var', '_docker_networks_custom', role='duplicati') }}"

# Capabilities
duplicati_role_docker_capabilities_default: []
duplicati_role_docker_capabilities_custom: []
duplicati_role_docker_capabilities: "{{ lookup('role_var', '_docker_capabilities_default', role='duplicati')
                                     + lookup('role_var', '_docker_capabilities_custom', role='duplicati') }}"

# Security Opts
duplicati_role_docker_security_opts_default: []
duplicati_role_docker_security_opts_custom: []
duplicati_role_docker_security_opts: "{{ lookup('role_var', '_docker_security_opts_default', role='duplicati')
                                      + lookup('role_var', '_docker_security_opts_custom', role='duplicati') }}"

# Restart Policy
duplicati_role_docker_restart_policy: unless-stopped

# State
duplicati_role_docker_state: started
