---
################################
# Basics
################################
simple_sq_music_plus_name: simple_sq_music_plus

################################
# Paths
################################
simple_sq_music_plus_role_paths_folder: "{{ simple_sq_music_plus_name }}"
simple_sq_music_plus_role_paths_location: "{{ server_appdata_path }}/{{ simple_sq_music_plus_role_paths_folder }}"
simple_sq_music_plus_role_paths_folders_list:
  - "{{ simple_sq_music_plus_role_paths_location }}"

################################
# Web
################################
simple_sq_music_plus_role_web_subdomain: "{{ simple_sq_music_plus_name }}"
simple_sq_music_plus_role_web_domain: "{{ user.domain }}"
simple_sq_music_plus_role_web_port: "80"
simple_sq_music_plus_role_web_url: "{{ 'https://' + (lookup('role_var', '_web_subdomain', role='simple_sq_music_plus') + '.' + lookup('role_var', '_web_domain', role='simple_sq_music_plus') if (lookup('role_var', '_web_subdomain', role='simple_sq_music_plus') | length > 0) else lookup('role_var', '_web_domain', role='simple_sq_music_plus')) }}"

################################
# DNS
################################
simple_sq_music_plus_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='simple_sq_music_plus') }}"
simple_sq_music_plus_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='simple_sq_music_plus') }}"
simple_sq_music_plus_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik (Reverse Proxy & Auth)
################################
simple_sq_music_plus_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
simple_sq_music_plus_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
simple_sq_music_plus_role_traefik_middleware_custom: ""
simple_sq_music_plus_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
simple_sq_music_plus_role_traefik_enabled: true
simple_sq_music_plus_role_traefik_api_enabled: false
simple_sq_music_plus_role_traefik_api_endpoint: ""

################################
# Docker
################################
simple_sq_music_plus_role_docker_container: "{{ simple_sq_music_plus_name }}"

# Image
simple_sq_music_plus_role_docker_image_pull: true
simple_sq_music_plus_role_docker_image_repo: "registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus"
simple_sq_music_plus_role_docker_image_tag: "latest"
simple_sq_music_plus_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='simple_sq_music_plus') }}:{{ lookup('role_var', '_docker_image_tag', role='simple_sq_music_plus') }}"

# Envs
simple_sq_music_plus_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  TZ: "{{ tz }}"

simple_sq_music_plus_role_docker_envs_custom: {}
simple_sq_music_plus_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='simple_sq_music_plus') | combine(lookup('role_var', '_docker_envs_custom', role='simple_sq_music_plus')) }}"

# Volumes
simple_sq_music_plus_role_docker_volumes_default:
  - "{{ simple_sq_music_plus_role_paths_location }}:/app/data"

simple_sq_music_plus_role_docker_volumes_custom: []
simple_sq_music_plus_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='simple_sq_music_plus') + lookup('role_var', '_docker_volumes_custom', role='simple_sq_music_plus') }}"

# Ports
simple_sq_music_plus_role_docker_ports_defaults: []
simple_sq_music_plus_role_docker_ports_custom: []
simple_sq_music_plus_role_docker_ports: "{{ lookup('role_var', '_docker_ports_defaults', role='simple_sq_music_plus') + lookup('role_var', '_docker_ports_custom', role='simple_sq_music_plus') }}"

# Network & Hostname
simple_sq_music_plus_role_docker_hostname: "{{ simple_sq_music_plus_name }}"
simple_sq_music_plus_role_docker_networks_alias: "{{ simple_sq_music_plus_name }}"
simple_sq_music_plus_role_docker_networks_default: []
simple_sq_music_plus_role_docker_networks_custom: []
simple_sq_music_plus_role_docker_networks: "{{ docker_networks_common + lookup('role_var', '_docker_networks_default', role='simple_sq_music_plus') + lookup('role_var', '_docker_networks_custom', role='simple_sq_music_plus') }}"

# Operations
simple_sq_music_plus_role_docker_restart_policy: unless-stopped
simple_sq_music_plus_role_docker_state: started