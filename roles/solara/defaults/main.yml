---
##################################################################################
# Title:         Saltbox Mod: Roles | solara | Defaults                          #
# Author(s):     hereisderek                                                     #
# URL:           https://github.com/hereisderek/saltbox_mod                      #
##################################################################################

################################
# Basics
################################
solara_name: solara

################################
# Paths
################################
solara_role_paths_folder: "{{ solara_name }}"
solara_role_paths_location: "{{ server_appdata_path }}/{{ solara_role_paths_folder }}"
solara_role_paths_folders_list:
  - "{{ solara_role_paths_location }}"
  - "{{ solara_role_paths_location }}/data"

################################
# Web
################################
solara_role_web_subdomain: "{{ solara_name }}"
solara_role_web_domain: "{{ user.domain }}"
solara_role_web_port: "8787"
solara_role_web_url: "{{ 'https://' + (lookup('role_var', '_web_subdomain', role='solara') + '.' + lookup('role_var', '_web_domain', role='solara') if (lookup('role_var', '_web_subdomain', role='solara') | length > 0) else lookup('role_var', '_web_domain', role='solara')) }}"

################################
# DNS
################################
solara_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='solara') }}"
solara_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='solara') }}"
solara_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik (Reverse Proxy & Auth)
################################
solara_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
solara_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
solara_role_traefik_middleware_custom: ""
solara_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
solara_role_traefik_enabled: true
solara_role_traefik_api_enabled: false
solara_role_traefik_api_endpoint: ""

################################
# Docker
################################
solara_role_docker_container: "{{ solara_name }}"

# Image
solara_role_docker_image_pull: true
solara_role_docker_image_repo: "ghcr.io/akudamatata/solara"
solara_role_docker_image_tag: "latest"
solara_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='solara') }}:{{ lookup('role_var', '_docker_image_tag', role='solara') }}"

# Init & Process Handling
solara_role_docker_init: true

# Envs
solara_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  TZ: "{{ tz }}"
  PASSWORD: "" # Protected by Authelia SSO by default
  API_BASE_URL: "https://music-api.gdstudio.xyz/api.php"
solara_role_docker_envs_custom: {}
solara_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='solara') | combine(lookup('role_var', '_docker_envs_custom', role='solara')) }}"

# Volumes
solara_role_docker_volumes_default:
  - "{{ solara_role_paths_location }}/data:/data"
solara_role_docker_volumes_custom: []
solara_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='solara') + lookup('role_var', '_docker_volumes_custom', role='solara') }}"

# Ports
solara_role_docker_ports_defaults: []
solara_role_docker_ports_custom: []
solara_role_docker_ports: "{{ lookup('role_var', '_docker_ports_defaults', role='solara') + lookup('role_var', '_docker_ports_custom', role='solara') }}"

# Network & Hostname
solara_role_docker_hostname: "{{ solara_name }}"
solara_role_docker_networks_alias: "{{ solara_name }}"
solara_role_docker_networks_default: []
solara_role_docker_networks_custom: []
solara_role_docker_networks: "{{ docker_networks_common + lookup('role_var', '_docker_networks_default', role='solara') + lookup('role_var', '_docker_networks_custom', role='solara') }}"

# Operations
solara_role_docker_restart_policy: unless-stopped
solara_role_docker_state: started
