---
# NOTE: this mod is Docker-only. Upstream's host-install mode
# (qbittorrent_role_host_install) is intentionally not supported here - use
# the upstream saltbox role directly (`sb install qbittorrent`) if you need
# a bare-metal qbittorrent-nox install.

- name: Force mod-specific variable overrides
  ansible.builtin.include_tasks: subtasks/mod_var_overrides.yml

- name: Add DNS record
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/dns/tasker.yml"
  vars:
    dns_record: "{{ lookup('role_var', '_dns_record') }}"
    dns_zone: "{{ lookup('role_var', '_dns_zone') }}"
    dns_proxy: "{{ lookup('role_var', '_dns_proxy') }}"

- name: Check if config file exists
  ansible.builtin.stat:
    path: "{{ lookup('role_var', '_paths_conf', role='qbittorrent') }}"
  register: qbittorrent_role_paths_conf_stat

- name: Check if legacy '{{ qbittorrent_name }}.service' exists
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ qbittorrent_name }}.service"
  register: qbittorrent_legacy_service

- name: "Execute legacy tasks"
  ansible.builtin.include_tasks: subtasks/legacy.yml
  when: qbittorrent_legacy_service.stat.exists

- name: Remove existing Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/remove_docker_container.yml"

- name: Assign ports
  port_assignment:
    base_path: "{{ server_appdata_path }}"
    namespace: qbittorrent
    owner: "{{ qbittorrent_name }}"
    claims:
      peer:
        low_bound: "{{ lookup('role_var', '_port_peer_low_bound', role='qbittorrent') }}"
        high_bound: "{{ lookup('role_var', '_port_peer_high_bound', role='qbittorrent') }}"
        protocols: ["tcp", "udp"]
  register: qbittorrent_port_assignment

- name: Normalize data directory layout
  ansible.builtin.include_tasks: subtasks/data_layout.yml

- name: Create directories
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/directories/create_directories.yml"

- name: Pre-Install Tasks
  ansible.builtin.include_tasks: "subtasks/pre-install/main.yml"

- name: Create Docker container
  ansible.builtin.include_tasks: "{{ resources_tasks_path }}/docker/create_docker_container.yml"

- name: Post-Install Tasks
  ansible.builtin.include_tasks: "subtasks/post-install/main.yml"
  when: (not qbittorrent_role_paths_conf_stat.stat.exists)

- name: Alternative WebUI Tasks
  ansible.builtin.include_tasks: "subtasks/alt_webui.yml"
  when: lookup('role_var', '_alt_webui_enabled', role='qbittorrent')
