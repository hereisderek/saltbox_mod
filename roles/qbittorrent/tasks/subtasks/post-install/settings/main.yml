---
- name: Run upstream post-install settings tasks
  ansible.builtin.include_tasks: /srv/git/saltbox/roles/qbittorrent/tasks/subtasks/post-install/settings/main.yml

- name: Post-Install | Mod Settings
  block:
    - name: Post-Install | Settings | Update WebUI\AlternativeUIEnabled 'qBittorrent.conf' config settings
      community.general.ini_file:
        path: "{{ lookup('role_var', '_paths_conf', role='qbittorrent') }}"
        section: Preferences
        option: WebUI\AlternativeUIEnabled
        value: "{{ 'true' if lookup('role_var', '_alt_webui_enabled', role='qbittorrent') else 'false' }}"
        no_extra_spaces: true
        state: present
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
      when: lookup('role_var', '_alt_webui_enabled', role='qbittorrent')

    - name: Post-Install | Settings | Update WebUI\AuthSubnetWhitelistEnabled 'qBittorrent.conf' config settings
      community.general.ini_file:
        path: "{{ lookup('role_var', '_paths_conf', role='qbittorrent') }}"
        section: Preferences
        option: WebUI\AuthSubnetWhitelistEnabled
        value: "{{ 'true' if lookup('role_var', '_auth_bypass_enabled', role='qbittorrent') else 'false' }}"
        no_extra_spaces: true
        state: present
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"

    - name: Post-Install | Settings | Update WebUI\AuthSubnetWhitelist 'qBittorrent.conf' config settings
      community.general.ini_file:
        path: "{{ lookup('role_var', '_paths_conf', role='qbittorrent') }}"
        section: Preferences
        option: WebUI\AuthSubnetWhitelist
        value: "{{ lookup('role_var', '_auth_subnet_whitelist', role='qbittorrent') }}"
        no_extra_spaces: true
        state: present
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
      when: lookup('role_var', '_auth_bypass_enabled', role='qbittorrent')

    - name: Post-Install | Settings | Update WebUI\LocalHostAuth 'qBittorrent.conf' config settings
      community.general.ini_file:
        path: "{{ lookup('role_var', '_paths_conf', role='qbittorrent') }}"
        section: Preferences
        option: WebUI\LocalHostAuth
        value: "{{ 'false' if lookup('role_var', '_auth_bypass_enabled', role='qbittorrent') else 'true' }}"
        no_extra_spaces: true
        state: present
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
        mode: "0664"
