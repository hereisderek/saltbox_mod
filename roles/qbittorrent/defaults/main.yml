#########################################################################
# Title:            Saltbox: qBittorrent Mod                            #
# Author(s):        salty, modded for saltbox_mod                       #
# URL:              https://github.com/saltyorg/Saltbox                 #
#########################################################################
#                   GNU General Public License v3.0                     #
#########################################################################
---
################################
# Basics
################################

qbittorrent_instances: ["qbittorrent"]

################################
# Settings
################################

qbittorrent_role_host_install: false
qbittorrent_role_webui_custom_headers_enabled: "{{ 'true'
                                                if lookup('role_var', '_themepark_enabled', role='qbittorrent') and global_themepark_plugin_enabled
                                                else 'false' }}"
qbittorrent_role_webui_custom_headers_default: "{{ (qbittorrent_role_themepark_headers
                                                    if lookup('role_var', '_themepark_enabled', role='qbittorrent') and global_themepark_plugin_enabled
                                                    else '') }}"
qbittorrent_role_webui_custom_headers_custom: ""
qbittorrent_role_webui_custom_headers: "{{ (lookup('role_var', '_webui_custom_headers_default', role='qbittorrent') | trim + ' ' + lookup('role_var', '_webui_custom_headers_custom', role='qbittorrent') | trim) | trim }}"
# Options are: Delete or MoveToTrash
qbittorrent_role_torrent_content_remove_option: "Delete"

################################
# Paths
################################

# "_mod" is always appended so this instance's data never collides with
# upstream Saltbox's own /opt/saltbox qbittorrent role (or another instance
# of it) sharing the same host and the same localhost.yml.
#
# NOTE: qbittorrent_role_paths_folder is NOT actually sourced from here -
# upstream's own qbittorrent role defines the same variable name (without
# "_mod"), and Saltbox's pre_tasks unconditionally loads every role's
# defaults at a HIGHER precedence than this file, so upstream's value would
# otherwise win. It's forced via set_fact in
# tasks/subtasks/mod_var_overrides.yml instead - see the comment there.
# Listed here anyway for documentation, and as the fallback if that task is
# ever skipped.
qbittorrent_role_paths_folder: "{{ qbittorrent_name }}_mod"
qbittorrent_role_paths_location: "{{ server_appdata_path }}/{{ qbittorrent_role_paths_folder }}"
qbittorrent_role_paths_downloads_location: "{{ downloads_torrents_path }}/{{ qbittorrent_role_paths_folder }}"
# Conf lives at the same host path regardless of image family (see docker
# volumes below) so switching qbittorrent_role_docker_image_repo never moves it.
qbittorrent_role_paths_conf: "{{ qbittorrent_role_paths_location }}/qBittorrent/qBittorrent.conf"
# Canonical, image-agnostic home for qBittorrent's session/runtime data
# (BT_backup, GeoDB, rss, network_state.conf, ...). Both the default and the
# hotio image are mounted so this same host directory is what they use.
qbittorrent_role_paths_data_location: "{{ qbittorrent_role_paths_location }}/data"
qbittorrent_role_paths_folders_list_default:
  - "{{ qbittorrent_role_paths_location }}"
  - "{{ qbittorrent_role_paths_location }}/qBittorrent"
  - "{{ qbittorrent_role_paths_data_location }}"
  - "{{ qbittorrent_role_paths_downloads_location }}"
  - "{{ qbittorrent_role_paths_downloads_location }}/completed"
  - "{{ qbittorrent_role_paths_downloads_location }}/incoming"
  - "{{ qbittorrent_role_paths_downloads_location }}/watched"
  - "{{ qbittorrent_role_paths_downloads_location }}/torrents"
qbittorrent_role_paths_folders_list_custom: []
# Also forced via set_fact in mod_var_overrides.yml - upstream defines this
# same combined variable name with a different (shorter) list.
qbittorrent_role_paths_folders_list: "{{ lookup('role_var', '_paths_folders_list_default', role='qbittorrent')
                                         + lookup('role_var', '_paths_folders_list_custom', role='qbittorrent') }}"

################################
# Web
################################

qbittorrent_role_web_subdomain: "{{ qbittorrent_name }}"
qbittorrent_role_web_domain: "{{ user.domain }}"
qbittorrent_role_web_port: "8080"
qbittorrent_role_web_url: "{{ lookup('role_web', role='qbittorrent', scheme='https') }}"

################################
# DNS
################################

qbittorrent_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='qbittorrent') }}"
qbittorrent_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='qbittorrent') }}"
qbittorrent_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

qbittorrent_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
qbittorrent_role_traefik_middleware_default: "{{ traefik_default_middleware
                                                 + (',themepark-' + qbittorrent_name
                                                    if (lookup('role_var', '_themepark_enabled', role='qbittorrent') and global_themepark_plugin_enabled)
                                                    else '') }}"
qbittorrent_role_traefik_middleware_custom: ""
qbittorrent_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
qbittorrent_role_traefik_middleware_custom_api: ""
qbittorrent_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
qbittorrent_role_traefik_enabled: true
qbittorrent_role_traefik_api_enabled: true
qbittorrent_role_traefik_api_endpoint: "PathPrefix(`/api`) || PathPrefix(`/command`) || PathPrefix(`/query`) || PathPrefix(`/login`) || PathPrefix(`/sync`)"

################################
# Theme
################################

# Options can be found at https://github.com/themepark-dev/theme.park
qbittorrent_role_themepark_enabled: false
qbittorrent_role_themepark_app: "qbittorrent"
qbittorrent_role_themepark_theme: "{{ global_themepark_theme }}"
qbittorrent_role_themepark_domain: "{{ global_themepark_domain }}"
qbittorrent_role_themepark_addons: []
qbittorrent_role_themepark_headers: "\"content-security-policy: default-src 'self'; style-src 'self' 'unsafe-inline' theme-park.dev raw.githubusercontent.com use.fontawesome.com; img-src 'self' theme-park.dev raw.githubusercontent.com data:; script-src 'self' 'unsafe-inline'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; font-src use.fontawesome.com;\""

################################
# Ports
################################

qbittorrent_role_port_peer_low_bound: 56881
qbittorrent_role_port_peer_high_bound: 56901
# Only used when qbittorrent_role_host_install is true; this mod targets Docker.
qbittorrent_role_port_web_low_bound: 8090
qbittorrent_role_port_web_high_bound: 8100

################################
# Docker
################################

# Container
qbittorrent_role_docker_container: "{{ qbittorrent_name }}"

# Image
qbittorrent_role_docker_image_pull: true
qbittorrent_role_docker_image_repo: "saltydk/qbittorrent"
qbittorrent_role_docker_image_tag: "latest"
qbittorrent_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='qbittorrent') }}:{{ lookup('role_var', '_docker_image_tag', role='qbittorrent') }}"
qbittorrent_role_is_hotio: "{{ 'hotio' in lookup('role_var', '_docker_image_repo', role='qbittorrent') }}"

# Ports
qbittorrent_role_docker_ports_default:
  - "{{ qbittorrent_port_assignment.ports.peer }}:{{ qbittorrent_port_assignment.ports.peer }}"
  - "{{ qbittorrent_port_assignment.ports.peer }}:{{ qbittorrent_port_assignment.ports.peer }}/udp"
qbittorrent_role_docker_ports_custom: []
qbittorrent_role_docker_ports: "{{ lookup('role_var', '_docker_ports_default', role='qbittorrent')
                                   + lookup('role_var', '_docker_ports_custom', role='qbittorrent') }}"

# Envs
qbittorrent_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  TZ: "{{ tz }}"
  UMASK: "002"
  UMASK_SET: "002"
  S6_SERVICES_GRACETIME: "{{ (lookup('role_var', '_docker_stop_timeout', role='qbittorrent') | int * 1000) | string }}"
qbittorrent_role_docker_envs_custom: {}
qbittorrent_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='qbittorrent')
                                  | combine(lookup('role_var', '_docker_envs_custom', role='qbittorrent')) }}"

# Volumes
#
# qbittorrent_role_docker_volumes(_default) is also forced via set_fact in
# mod_var_overrides.yml, for the same reason as paths_folder above - upstream
# defines both these names too, with a plain single "/config" mount and no
# hotio awareness, and would otherwise win.
#
# Both image families are mounted from the SAME two host directories
# (paths_location/qBittorrent and paths_location/data) - only the container
# side of the mount differs. This means switching
# qbittorrent_role_docker_image_repo between the default image and the hotio
# image never requires moving/copying any data: the next deploy just mounts
# the same files at a different spot in the new container.
qbittorrent_role_docker_volumes_default: "{{
  (
    [
      lookup('role_var', '_paths_location', role='qbittorrent') + '/qBittorrent:/config/config',
      lookup('role_var', '_paths_data_location', role='qbittorrent') + ':/config/data'
    ]
    if lookup('role_var', '_is_hotio', role='qbittorrent')
    else
    [
      lookup('role_var', '_paths_location', role='qbittorrent') + ':/config',
      lookup('role_var', '_paths_data_location', role='qbittorrent') + ':/config/qBittorrent/data'
    ]
  ) + [ server_appdata_path + '/scripts:/scripts' ]
}}"
qbittorrent_role_docker_volumes_custom: []
qbittorrent_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='qbittorrent')
                                     + lookup('role_var', '_docker_volumes_custom', role='qbittorrent') }}"

# Labels
qbittorrent_role_docker_labels_default: {}
qbittorrent_role_docker_labels_custom: {}
qbittorrent_role_docker_labels: "{{ lookup('role_var', '_docker_labels_default', role='qbittorrent')
                                    | combine((traefik_themepark_labels
                                               if (lookup('role_var', '_themepark_enabled', role='qbittorrent') and global_themepark_plugin_enabled)
                                               else {}),
                                              lookup('role_var', '_docker_labels_custom', role='qbittorrent')) }}"

# Hostname
qbittorrent_role_docker_hostname: "{{ qbittorrent_name }}"

# Networks
qbittorrent_role_docker_networks_alias: "{{ qbittorrent_name }}"
qbittorrent_role_docker_networks_default: []
qbittorrent_role_docker_networks_custom: []
qbittorrent_role_docker_networks: "{{ docker_networks_common
                                      + lookup('role_var', '_docker_networks_default', role='qbittorrent')
                                      + lookup('role_var', '_docker_networks_custom', role='qbittorrent') }}"

# Restart Policy
qbittorrent_role_docker_restart_policy: unless-stopped

# Stop Timeout
qbittorrent_role_docker_stop_timeout: 900

################################
# Alt WebUI (Third-Party WebUI)
################################

qbittorrent_role_alt_webui_enabled: false
qbittorrent_role_alt_webui_url: "https://github.com/VueTorrent/VueTorrent"
qbittorrent_role_alt_webui_version: "latest"
qbittorrent_role_alt_webui_dir: "{{ lookup('role_var', '_paths_location', role='qbittorrent') }}/webui"
# Path as seen INSIDE the container (api key: alternative_webui_path).
qbittorrent_role_alt_webui_container_path: "/config/webui"

################################
# WebUI Security Settings
#
# Applied via plain ini_file edits (see tasks/subtasks/mod_settings.yml),
# same as upstream's own settings tasks - written while the container is
# stopped, which is what actually makes them stick. Username/password are
# left entirely to upstream's own post-install (user.name / user.pass, set
# once on first bootstrap) rather than reset here on every redeploy.
################################

# Whether to bypass qBittorrent's own login prompt for requests whose
# (reverse-proxy-derived) client IP falls inside the whitelist below. This is
# safe to enable for LAN/VPN ranges because Traefik's `qbittorrent` /
# `qbittorrent-http` routers already require Authelia. It must NOT be
# widened to 0.0.0.0/0: the separate `qbittorrent-api` / `qbittorrent-api-http`
# Traefik routers intentionally bypass Authelia (for *arr-style automation
# hitting /api, /command, /query, /login, /sync), so qBittorrent's own auth
# is the only gate left on those paths - whitelisting all IPs there would
# leave them open to the entire internet.
qbittorrent_role_auth_bypass_enabled: false
qbittorrent_role_auth_subnet_whitelist: "172.19.0.0/16"

# qBittorrent sits behind Traefik on the "saltbox" docker network, so trust
# X-Forwarded-For from that network to resolve the real client IP for the
# whitelist check above (rather than Traefik's own container IP).
qbittorrent_role_reverse_proxy_enabled: true
qbittorrent_role_reverse_proxies_list: "172.19.0.0/16"

# qBittorrent's built-in anti-bruteforce lockout (WebUI\MaxAuthenticationFailCount
# failed attempts within a window -> ban for WebUI\BanDuration seconds) applies
# per derived client IP and is easy to trip by accident (e.g. testing a login
# flow, or a password manager retry) - once tripped, even fully correct
# credentials from that IP are rejected until the ban expires.
#
# Left empty by default: this mod does not manage these two settings unless
# you explicitly set a value in localhost.yml. Empty means "leave qBittorrent's
# own built-in default (and whatever it currently has on disk) alone" - see
# tasks/subtasks/mod_settings.yml, which skips the ini_file task entirely
# when empty rather than writing a value.
qbittorrent_role_webui_max_auth_fail_count: ""
qbittorrent_role_webui_ban_duration: ""
