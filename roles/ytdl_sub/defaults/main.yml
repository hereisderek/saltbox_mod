---
################################
# Basics
################################

ytdl_sub_name: ytdl-sub

################################
# Settings
################################

ytdl_sub_role_cron_schedule: "0 */6 * * *"
ytdl_sub_role_cron_on_start: "true"

################################
# Paths
################################

ytdl_sub_role_paths_folder: "{{ ytdl_sub_name }}"
ytdl_sub_role_paths_location: "{{ server_appdata_path }}/{{ ytdl_sub_role_paths_folder }}"
ytdl_sub_role_download_folder: "/mnt/unionfs/Media/Youtube/{{ ytdl_sub_name }}"
ytdl_sub_role_paths_folders_list_default:
  - "{{ lookup('role_var', '_paths_location', role='ytdl_sub') }}"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/tv_shows"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/movies"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/music_videos"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/music"
ytdl_sub_role_paths_folders_list_custom: []
ytdl_sub_role_paths_folders_list: "{{ lookup('role_var', '_paths_folders_list_default', role='ytdl_sub')
                                    + lookup('role_var', '_paths_folders_list_custom', role='ytdl_sub') }}"

################################
# Docker
################################

# Container
ytdl_sub_role_docker_container: "{{ ytdl_sub_name }}"

# Image
ytdl_sub_role_docker_image_pull: true
ytdl_sub_role_docker_image_tag: "ubuntu-latest"
ytdl_sub_role_docker_image_repo: "ghcr.io/jmbannon/ytdl-sub"
ytdl_sub_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='ytdl_sub') }}:{{ lookup('role_var', '_docker_image_tag', role='ytdl_sub') }}"

# Ports
ytdl_sub_role_docker_ports_defaults: []
ytdl_sub_role_docker_ports_custom: []
ytdl_sub_role_docker_ports: "{{ lookup('role_var', '_docker_ports_defaults', role='ytdl_sub')
                              + lookup('role_var', '_docker_ports_custom', role='ytdl_sub') }}"

# Envs
ytdl_sub_role_docker_envs_default:
  PUID: "{{ uid }}"
  PGID: "{{ gid }}"
  TZ: "{{ tz }}"
  CRON_SCHEDULE: "{{ lookup('role_var', '_cron_schedule', role='ytdl_sub') }}"
  CRON_RUN_ON_START: "{{ lookup('role_var', '_cron_on_start', role='ytdl_sub') }}"
ytdl_sub_role_docker_envs_custom: {}
ytdl_sub_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='ytdl_sub')
                             | combine(lookup('role_var', '_docker_envs_custom', role='ytdl_sub')) }}"

# Commands
ytdl_sub_role_docker_commands_default: []
ytdl_sub_role_docker_commands_custom: []
ytdl_sub_role_docker_commands: "{{ lookup('role_var', '_docker_commands_default', role='ytdl_sub')
                                 + lookup('role_var', '_docker_commands_custom', role='ytdl_sub') }}"

# Volumes
ytdl_sub_role_docker_volumes_default:
  - "{{ lookup('role_var', '_paths_location', role='ytdl_sub') }}:/config"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}:/ytdl_sub"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/tv_shows:/tv_shows"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/movies:/movies"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/music_videos:/music_videos"
  - "{{ lookup('role_var', '_download_folder', role='ytdl_sub') }}/music:/music"
ytdl_sub_role_docker_volumes_custom: []
ytdl_sub_role_docker_volumes: "{{ lookup('role_var', '_docker_volumes_default', role='ytdl_sub')
                                + lookup('role_var', '_docker_volumes_custom', role='ytdl_sub')
                                + docker_volumes_downloads_common }}"

# Devices
ytdl_sub_role_docker_devices_default: []
ytdl_sub_role_docker_devices_custom: []
ytdl_sub_role_docker_devices: "{{ lookup('role_var', '_docker_devices_default', role='ytdl_sub')
                                + lookup('role_var', '_docker_devices_custom', role='ytdl_sub') }}"

# Hosts
ytdl_sub_role_docker_hosts_default: {}
ytdl_sub_role_docker_hosts_custom: {}
ytdl_sub_role_docker_hosts: "{{ docker_hosts_common
                              | combine(lookup('role_var', '_docker_hosts_default', role='ytdl_sub'))
                              | combine(lookup('role_var', '_docker_hosts_custom', role='ytdl_sub')) }}"

# Labels
ytdl_sub_role_docker_labels_default: {}
ytdl_sub_role_docker_labels_custom: {}
ytdl_sub_role_docker_labels: "{{ docker_labels_common
                               | combine(lookup('role_var', '_docker_labels_default', role='ytdl_sub'))
                               | combine(lookup('role_var', '_docker_labels_custom', role='ytdl_sub')) }}"

# Hostname
ytdl_sub_role_docker_hostname: "{{ ytdl_sub_name }}"

# Networks
ytdl_sub_role_docker_networks_alias: "{{ ytdl_sub_name }}"
ytdl_sub_role_docker_networks_default: []
ytdl_sub_role_docker_networks_custom: []
ytdl_sub_role_docker_networks: "{{ docker_networks_common
                                 + lookup('role_var', '_docker_networks_default', role='ytdl_sub')
                                 + lookup('role_var', '_docker_networks_custom', role='ytdl_sub') }}"

# Capabilities
ytdl_sub_role_docker_capabilities_default: []
ytdl_sub_role_docker_capabilities_custom: []
ytdl_sub_role_docker_capabilities: "{{ lookup('role_var', '_docker_capabilities_default', role='ytdl_sub')
                                     + lookup('role_var', '_docker_capabilities_custom', role='ytdl_sub') }}"

# Security Opts
ytdl_sub_role_docker_security_opts_default: []
ytdl_sub_role_docker_security_opts_custom: []
ytdl_sub_role_docker_security_opts: "{{ lookup('role_var', '_docker_security_opts_default', role='ytdl_sub')
                                      + lookup('role_var', '_docker_security_opts_custom', role='ytdl_sub') }}"

# Restart Policy
ytdl_sub_role_docker_restart_policy: unless-stopped

# State
ytdl_sub_role_docker_state: started
